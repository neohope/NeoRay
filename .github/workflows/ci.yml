name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (vet / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoray
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: neoray/go.mod
          cache-dependency-path: neoray/go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./internal/... ./test/... -count=1 -timeout 15m

      - name: go build
        run: go build ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoray
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: neoray/go.mod
          cache-dependency-path: neoray/go.sum

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        # 仅排除 ST1018：默认 SOUL 文案里的 emoji 含零宽连接符，属有意为之。
        # 未使用代码（U1000）已于 2026-10-22 清理完毕，不再豁免。
        run: staticcheck -checks "inherit,-ST1018" ./...

  govulncheck:
    name: govulncheck (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neoray
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: neoray/go.mod
          cache-dependency-path: neoray/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
